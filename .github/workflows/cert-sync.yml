name: Verify and publish cert-sync

on:
  push:
    branches: [main]
    paths: ['cert-sync/**', '.github/workflows/cert-sync.yml']
  pull_request:
    branches: [main]
    paths: ['cert-sync/**', '.github/workflows/cert-sync.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified cert-sync from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cert-sync-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cert-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure source tag
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_URL=$SERVER_URL/$REPOSITORY" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime and synthetic test image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: cert-sync/docker-bake.hcl
          targets: cert-sync,cert-sync-test
          load: true
          provenance: false
          set: |
            *.cache-from=type=gha,scope=cert-sync
            *.cache-to=type=gha,mode=max,scope=cert-sync
      - name: Test protocol, console and actual runtime behind Traefik
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 "neptu-cert-sync-test:$REVISION"
          python3 cert-sync/smoke-test.py --image "ghcr.io/joysun99/neptu-cert-sync:git-$REVISION"
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified runtime
        id: publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: cert-sync/docker-bake.hcl
          targets: cert-sync
          push: true
          provenance: mode=max
      - name: Pull back and verify published digest
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          BUILD_METADATA: ${{ steps.publish.outputs.metadata }}
        run: |
          DIGEST=$(python3 -c 'import json,os; print(json.loads(os.environ["BUILD_METADATA"])["cert-sync"]["containerimage.digest"])')
          IMAGE="ghcr.io/joysun99/neptu-cert-sync@$DIGEST"
          docker pull "$IMAGE"
          python3 cert-sync/smoke-test.py --image "$IMAGE"
          echo "Deployment reference: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: \`$GITHUB_SHA\`; synthetic protocol and real Traefik integration passed. Production rollout remains separate." >> "$GITHUB_STEP_SUMMARY"
