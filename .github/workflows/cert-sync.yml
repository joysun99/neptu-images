name: Verify and publish cert-sync

on:
  push:
    branches: [main]
    paths: ['cert-sync/**', '.github/workflows/cert-sync.yml']
  pull_request:
    branches: [main]
    paths: ['cert-sync/**', '.github/workflows/cert-sync.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed cert-only Go binary from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cert-sync-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cert-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify reviewed public input
        run: |
          python3 cert-sync/go/test-input.py
          python3 cert-sync/go/prepare-input.py --github-env
          echo "REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build cert-only runtime
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          source: .
          files: cert-sync/go/docker-bake.hcl
          load: true
          provenance: false
      - name: Verify actual image and foreground lifecycle
        run: |
          python3 cert-sync/go/smoke-test.py --image "ghcr.io/joysun99/neptu-cert-sync:go-git-$SOURCE_COMMIT"
      - name: Log in for publication only
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified runtime
        id: publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          source: .
          files: cert-sync/go/docker-bake.hcl
          push: true
          provenance: mode=max
      - name: Anonymously pull back and verify exact digest
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          BUILD_METADATA: ${{ steps.publish.outputs.metadata }}
        run: |
          DIGEST=$(python3 -c 'import json,os; print(json.loads(os.environ["BUILD_METADATA"])["cert-sync"]["containerimage.digest"])')
          IMAGE="ghcr.io/joysun99/neptu-cert-sync@$DIGEST"
          python3 deploy/pull-public-image.py "$IMAGE"
          python3 cert-sync/go/smoke-test.py --image "$IMAGE"
          echo "CERT_SYNC_PUBLISHED_DIGEST=$DIGEST"
          echo "Deployment reference: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Application source: \`$SOURCE_COMMIT\`; public recipe: \`$GITHUB_SHA\`. Production adoption remains separate." >> "$GITHUB_STEP_SUMMARY"
