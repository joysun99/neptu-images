name: Verify and publish GDS Device Dispatch

on:
  push:
    branches: [main]
    paths: ['gds-device-dispatch/**', '.github/workflows/gds-device-dispatch.yml']
  pull_request:
    branches: [main]
    paths: ['gds-device-dispatch/**', '.github/workflows/gds-device-dispatch.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed static binary input from main
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gds-device-dispatch-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gds-device-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify reviewed public binary input
        run: |
          python3 gds-device-dispatch/test-input.py
          python3 gds-device-dispatch/prepare-input.py --github-env
          echo "REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build minimal runtime
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          source: .
          files: gds-device-dispatch/docker-bake.hcl
          load: true
          provenance: false
      - name: Verify actual binary, runtime users and source binding
        run: |
          python3 gds-device-dispatch/smoke-test.py --image "ghcr.io/joysun99/neptu-images:gds-device-dispatch-git-$SOURCE_COMMIT"
      - name: Log in for publication only
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified runtime
        id: publish
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e
        with:
          source: .
          files: gds-device-dispatch/docker-bake.hcl
          push: true
          provenance: mode=max
      - name: Pull back exact published digest
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          BUILD_METADATA: ${{ steps.publish.outputs.metadata }}
        run: |
          DIGEST=$(python3 -c 'import json,os; print(json.loads(os.environ["BUILD_METADATA"])["gds-device-dispatch"]["containerimage.digest"])')
          IMAGE="ghcr.io/joysun99/neptu-images@$DIGEST"
          python3 deploy/pull-public-image.py "$IMAGE"
          python3 gds-device-dispatch/smoke-test.py --image "$IMAGE"
          echo "Deployment reference: \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Binary source: \`$SOURCE_COMMIT\`; recipe: \`$GITHUB_SHA\`. Production rollout remains separate." >> "$GITHUB_STEP_SUMMARY"
